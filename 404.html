<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Yang Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="/assets/img/qwen-color.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Spline Sans Mono', monospace;
      background-color: #f5f5f5;
      color: #080708;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .terminal {
      width: 100%;
      max-width: 640px;
      background-color: #080708;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(8, 7, 8, 0.18);
      overflow: hidden;
    }
    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background-color: #1a1a1a;
    }
    .terminal-bar .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background-color: #ff5f57; }
    .dot-yellow { background-color: #febc2e; }
    .dot-green { background-color: #28c840; }
    .terminal-bar .bar-title {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: #888;
      /* offset the dots so the title sits visually centered */
      margin-right: 52px;
    }
    .terminal-body {
      padding: 20px 18px 24px;
      font-size: 13px;
      line-height: 26px;
      color: #e8e8e8;
      min-height: 190px;
    }
    .line { white-space: pre-wrap; word-break: break-all; visibility: hidden; }
    .line.shown { visibility: visible; }
    .prompt { color: #888; }
    .err { color: #ff5f57; }
    .terminal-body a {
      color: #e8e8e8;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .terminal-body a:hover {
      color: #080708;
      background-color: rgba(255, 236, 0, 0.9);
      text-decoration: none;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      vertical-align: text-bottom;
      background-color: rgba(255, 236, 0, 0.9);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <div class="terminal" role="main" aria-label="404 page not found">
    <div class="terminal-bar">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
      <span class="bar-title">yang@ysong.dev — zsh</span>
    </div>
    <div class="terminal-body">
      <div class="line"><span class="prompt">yang@ysong.dev:~$</span> cd <span id="req-path">/404</span></div>
      <div class="line"><span class="err">cd: no such file or directory (404)</span></div>
      <div class="line"><span class="prompt">yang@ysong.dev:~$</span> ls ~</div>
      <div class="line"><a href="/#work">work/</a>  <a href="/#info">info/</a>  <a href="/#connect">connect/</a></div>
      <div class="line"><span class="prompt">yang@ysong.dev:~$</span> <a href="/">cd ~</a><span class="cursor" aria-hidden="true"></span></div>
    </div>
  </div>
  <script>
    (function () {
      var path = window.location.pathname;
      if (path && path !== '/404.html') {
        document.getElementById('req-path').textContent = path;
      }
      var lines = document.querySelectorAll('.line');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) {
        lines.forEach(function (line) { line.classList.add('shown'); });
        return;
      }
      var delays = [0, 500, 1100, 1500, 2300];
      lines.forEach(function (line, i) {
        setTimeout(function () { line.classList.add('shown'); }, delays[i]);
      });
    })();
  </script>
</body>
</html>
